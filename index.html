<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; background: black; overflow: hidden; }
        canvas { position: absolute; }
        .content { position: relative; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
        .btn { background: black; color: #0f0; border: 2px solid #0f0; padding: 15px; width: 250px; margin: 10px; font-weight: bold; cursor: pointer; }
        h1 { color: #0f0; text-shadow: 0 0 10px #0f0; }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <div class="content">
        <h1>NEURO-INSULIN</h1>
        <button class="btn">SCANNER LE RÉSEAU</button>
        <button class="btn" onclick="location.href='https://gumroad.com/kabbach'">COMMANDER</button>
    </div>
    <script>
        const c = document.getElementById("c"), ctx = c.getContext("2d");
        c.height = window.innerHeight; c.width = window.innerWidth;
        const matrix = "ABCDEFGHIJKLMNOPQRSTUVWXYZ123456789KABBACH";
        const columns = c.width / 20; const drops = Array(Math.floor(columns)).fill(1);
        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)"; ctx.fillRect(0, 0, c.width, c.height);
            ctx.fillStyle = "#0f0"; ctx.font = "20px monospace";
            drops.forEach((y, i) => {
                const text = matrix[Math.floor(Math.random() * matrix.length)];
                ctx.fillText(text, i * 20, y * 20);
                if (y * 20 > c.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(draw, 35);
    </script>
</body>
</html>
