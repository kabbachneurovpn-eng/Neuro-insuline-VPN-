<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEURO-INSULIN</title>
    <style>
        body, html { margin: 0; padding: 0; background: black; color: #00ff00; font-family: monospace; overflow: hidden; height: 100%; }
        #matrixCanvas { position: fixed; top: 0; left: 0; z-index: -1; }
        .ui { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; border: 2px solid #00ff00; margin: 10px; background: rgba(0,0,0,0.8); box-shadow: inset 0 0 20px #00ff00; }
        .status { border: 1px solid #00ff00; padding: 5px; margin-bottom: 20px; animation: blink 2s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        h1 { font-size: 2rem; letter-spacing: 5px; text-shadow: 0 0 10px #00ff00; }
        input { background: transparent; border: 1px solid #00ff00; color: #00ff00; padding: 10px; width: 80%; margin-bottom: 20px; text-align: center; outline: none; }
        .btn { background: transparent; color: #00ff00; border: 2px solid #00ff00; padding: 15px; width: 250px; cursor: pointer; text-transform: uppercase; font-weight: bold; margin: 5px; }
        .btn:hover { background: #00ff00; color: black; box-shadow: 0 0 30px #00ff00; }
        .console { margin-top: 20px; padding: 10px; width: 80%; border: 1px dashed #00ff00; min-height: 50px; font-size: 0.8rem; }
    </style>
</head>
<body>
<canvas id="matrixCanvas"></canvas>
<div class="ui">
    <div class="status" id="st">[ SYSTEME: EN ATTENTE ]</div>
    <h1>NEURO-INSULIN</h1>
    <input type="text" placeholder="ENTREZ LES COORDONNÉES...">
    <button class="btn" onclick="sc()">SCANNER LE RÉSEAU</button>
    <button class="btn" onclick="ds()">COMMANDER UNE DOSE</button>
    <div class="console" id="log">> Prêt...</div>
</div>
<script>
    const c = document.getElementById('matrixCanvas');
    const x = c.getContext('2d');
    c.width = window.innerWidth; c.height = window.innerHeight;
    const m = "01"; const f = 16; const col = c.width / f; const d = Array(Math.floor(col)).fill(1);
    function dr() {
        x.fillStyle = "rgba(0,0,0,0.05)"; x.fillRect(0,0,c.width,c.height);
        x.fillStyle = "#0F0"; x.font = f + "px monospace";
        d.forEach((y, i) => {
            x.fillText(m[Math.floor(Math.random()*m.length)], i*f, y*f);
            if(y*f > c.height && Math.random() > 0.975) d[i] = 0; d[i]++;
        });
    }
    setInterval(dr, 40);
    const l = document.getElementById('log');
    const s = document.getElementById('st');
    function sc() {
        s.innerText = "[ SCANNING... ]"; let p = 0;
        let i = setInterval(() => {
            p += 10; l.innerText = `> Analyse... ${p}%`;
            if(p >= 100) { clearInterval(i); l.innerText = "> Scan terminé. Focus stabilisé."; s.innerText = "[ PRET ]"; }
        }, 100);
    }
    function ds() { const l = document.getElementById("log"); l.innerText = "> جاري استخراج الجرعة الرقمية... يرجى الانتظار"; setTimeout(() => { window.location.href = "https://gumroad.com/kabbach"; }, 2000); }
        l.innerText = "> Préparation de la dose...";
        setTimeout(() => { l.innerText = "> Dose envoyée. Concentration active."; }, 1500);
    }
</script>
</body>
</html>
