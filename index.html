<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEURO-INSULIN</title>
    <style>
        body { margin: 0; background: black; overflow: hidden; font-family: monospace; }
        canvas { position: absolute; top: 0; left: 0; }
        .ui { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: rgba(0,0,0,0.6); }
        .btn { background: transparent; color: #0f0; border: 2px solid #0f0; padding: 15px; width: 280px; margin: 10px; cursor: pointer; font-weight: bold; text-shadow: 0 0 5px #0f0; box-shadow: 0 0 10px rgba(0,255,0,0.2); }
        h1 { color: #0f0; letter-spacing: 5px; text-shadow: 0 0 15px #0f0; }
        .console { border: 1px dashed #0f0; color: #0f0; padding: 10px; width: 80%; min-height: 50px; font-size: 0.8rem; margin-top: 20px; }
    </style>
</head>
<body>
    <canvas id="m"></canvas>
    <div class="ui">
        <h1 id="header">NEURO-INSULIN</h1>
        <button class="btn" onclick="sc()">SCANNER LE RÉSEAU</button>
        <button class="btn" onclick="ds()">COMMANDER UNE DOSE</button>
        <div class="console" id="log">> Système prêt...</div>
    </div>
    <script>
        const c = document.getElementById('m'), x = c.getContext('2d');
        c.width = window.innerWidth; c.height = window.innerHeight;
        const words = "NEURO INSULIN VPN FOCUS KABBACH 01 TERMUX GALAXY".split(" ");
        const f = 16, columns = c.width / f, drops = Array(Math.floor(columns)).fill(1);
        function draw() {
            x.fillStyle = "rgba(0, 0, 0, 0.05)"; x.fillRect(0, 0, c.width, c.height);
            x.fillStyle = "#0f0"; x.font = f + "px monospace";
            drops.forEach((y, i) => {
                const txt = words[Math.floor(Math.random() * words.length)];
                x.fillText(txt, i * f * 3, y * f);
                if (y * f > c.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(draw, 50);
        function sc() { 
            const l = document.getElementById('log'); 
            l.innerText = "> Analysing Digital Nodes...";
            setTimeout(() => { l.innerText = "> Secure Tunnel Established."; }, 1500);
        }
        function ds() {
            document.getElementById('log').innerText = "> Extraction de la Dose...";
            setTimeout(() => { window.location.href = "https://gumroad.com/kabbach"; }, 1500);
        }
    </script>
</body>
</html>
